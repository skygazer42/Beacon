apiVersion: v1
kind: Pod
metadata:
  name: {{ include "beacon-cloud-saas-v1.fullname" . }}-test-connection
  labels:
    {{- include "beacon-cloud-saas-v1.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 60
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ include "beacon-cloud-saas-v1.imageRef" (dict "name" "helmTest" "image" .Values.helmTest.image "requireDigest" true) | quote }}
      imagePullPolicy: {{ .Values.helmTest.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 128Mi
      command:
        - /bin/sh
        - -ec
        - wget -T 5 --header "Authorization: Bearer $BEACON_OPEN_API_TOKEN" -qO- http://{{ include "beacon-cloud-saas-v1.fullname" . }}:{{ .Values.beaconCloud.service.port }}/readyz >/dev/null
      env:
        - name: BEACON_OPEN_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "beacon-cloud-saas-v1.secretName" . }}
              key: beacon-open-api-token
