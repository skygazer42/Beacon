apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beacon-cloud-saas-v1.backgroundWorkerName" . }}
  labels:
    {{- include "beacon-cloud-saas-v1.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-worker
spec:
  replicas: {{ .Values.backgroundWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: background-worker
  template:
    metadata:
      labels:
        {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: background-worker
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.backgroundWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "beacon-cloud-saas-v1.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: background-worker
          image: {{ include "beacon-cloud-saas-v1.imageRef" (dict "name" "beaconCloud" "image" .Values.beaconCloud.image "requireDigest" (ne .Values.beaconCloud.secrets.existingSecret "")) | quote }}
          imagePullPolicy: {{ .Values.beaconCloud.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
          command:
            - /app/deploy/cloud-saas-v1/scripts/background_worker_entrypoint.sh
          env:
            {{- include "beacon-cloud-saas-v1.runtimeEnv" (dict "root" . "role" "worker") | nindent 12 }}
          startupProbe:
            exec:
              command:
                - python
                - /app/deploy/cloud-saas-v1/scripts/health_probe.py
                - worker
            periodSeconds: 2
            timeoutSeconds: 4
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - python
                - /app/deploy/cloud-saas-v1/scripts/health_probe.py
                - worker
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - /app/deploy/cloud-saas-v1/scripts/health_probe.py
                - worker
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - name: app-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: app-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: {{ .Values.backgroundWorker.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.backgroundWorker.resources.requests.memory | default "256Mi" | quote }}
              ephemeral-storage: {{ .Values.backgroundWorker.resources.requests.ephemeralStorage | default "512Mi" | quote }}
            limits:
              cpu: {{ .Values.backgroundWorker.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.backgroundWorker.resources.limits.memory | default "512Mi" | quote }}
              ephemeral-storage: {{ .Values.backgroundWorker.resources.limits.ephemeralStorage | default "1Gi" | quote }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "beacon-cloud-saas-v1.fullname" . }}-config
        - name: app-data
          {{- if .Values.beaconCloud.runtimeStorage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "beacon-cloud-saas-v1.runtimePVCName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.beaconCloud.runtimeStorage.dataSizeLimit | quote }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.beaconCloud.runtimeStorage.tmpSizeLimit | quote }}
      nodeSelector:
        {{- toYaml .Values.backgroundWorker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.backgroundWorker.tolerations | nindent 8 }}
      affinity:
        {{- if .Values.backgroundWorker.affinity }}
        {{- toYaml .Values.backgroundWorker.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: background-worker
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: background-worker
      terminationGracePeriodSeconds: 60
