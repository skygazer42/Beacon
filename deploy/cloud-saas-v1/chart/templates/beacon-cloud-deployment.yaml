{{- if lt (int .Values.beaconCloud.replicaCount) 1 -}}
{{- fail "beaconCloud.replicaCount must be at least 1" -}}
{{- end -}}
{{- if lt (int .Values.backgroundWorker.replicaCount) 1 -}}
{{- fail "backgroundWorker.replicaCount must be at least 1" -}}
{{- end -}}
{{- if and .Values.beaconCloud.secrets.existingSecret (lt (int .Values.beaconCloud.replicaCount) 2) -}}
{{- fail "production deployments with an existing Secret require at least 2 Web replicas" -}}
{{- end -}}
{{- if and .Values.beaconCloud.secrets.existingSecret (lt (int .Values.backgroundWorker.replicaCount) 2) -}}
{{- fail "production deployments with an existing Secret require at least 2 background Worker replicas" -}}
{{- end -}}
{{- if and (gt (int .Values.beaconCloud.replicaCount) 1) (not .Values.beaconCloud.runtimeStorage.persistence.enabled) -}}
{{- fail "multiple Web replicas require beaconCloud.runtimeStorage.persistence.enabled=true" -}}
{{- end -}}
{{- if and .Values.beaconCloud.secrets.existingSecret (not .Values.beaconCloud.runtimeStorage.persistence.enabled) -}}
{{- fail "production deployments require shared runtime persistence" -}}
{{- end -}}
{{- if and .Values.beaconCloud.runtimeStorage.persistence.enabled (not .Values.beaconCloud.runtimeStorage.persistence.existingClaim) (gt (int .Values.beaconCloud.replicaCount) 1) (not (has "ReadWriteMany" .Values.beaconCloud.runtimeStorage.persistence.accessModes)) -}}
{{- fail "generated runtime storage for multiple Web replicas must include ReadWriteMany" -}}
{{- end -}}
{{- if ne (toString .Values.beaconCloud.env.djangoDebug) "0" -}}
{{- fail "beaconCloud.env.djangoDebug must be 0" -}}
{{- end -}}
{{- if or (not .Values.beaconCloud.env.djangoAllowedHosts) (contains "*" .Values.beaconCloud.env.djangoAllowedHosts) -}}
{{- fail "beaconCloud.env.djangoAllowedHosts must be non-empty and must not contain a wildcard" -}}
{{- end -}}
{{- if and (or (not .Values.postgres.enabled) (not .Values.minio.enabled)) (not .Values.beaconCloud.secrets.existingSecret) -}}
{{- fail "beaconCloud.secrets.existingSecret is required when bundled PostgreSQL or MinIO is disabled" -}}
{{- end -}}
{{- if and .Values.beaconCloud.env.bootstrapEdgeTokenFile (not .Values.demoVolume.enabled) -}}
{{- fail "demoVolume.enabled must be true when beaconCloud.env.bootstrapEdgeTokenFile is configured" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beacon-cloud-saas-v1.fullname" . }}
  labels:
    {{- include "beacon-cloud-saas-v1.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.beaconCloud.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beacon-cloud
  template:
    metadata:
      labels:
        {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beacon-cloud
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.beaconCloud.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "beacon-cloud-saas-v1.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beacon-cloud
          image: {{ include "beacon-cloud-saas-v1.imageRef" (dict "name" "beaconCloud" "image" .Values.beaconCloud.image "requireDigest" (ne .Values.beaconCloud.secrets.existingSecret "")) | quote }}
          imagePullPolicy: {{ .Values.beaconCloud.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
          command:
            - /app/deploy/cloud-saas-v1/scripts/entrypoint.sh
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "beacon-cloud-saas-v1.runtimeEnv" (dict "root" . "role" "web") | nindent 12 }}
          startupProbe:
            exec:
              command:
                - python
                - /app/deploy/cloud-saas-v1/scripts/health_probe.py
                - health
            periodSeconds: 2
            timeoutSeconds: 4
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - python
                - /app/deploy/cloud-saas-v1/scripts/health_probe.py
                - ready
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - /app/deploy/cloud-saas-v1/scripts/health_probe.py
                - health
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - name: app-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: app-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.demoVolume.enabled }}
            - name: demo
              mountPath: /demo
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.beaconCloud.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.beaconCloud.resources.requests.memory | default "256Mi" | quote }}
              ephemeral-storage: {{ .Values.beaconCloud.resources.requests.ephemeralStorage | default "1Gi" | quote }}
            limits:
              cpu: {{ .Values.beaconCloud.resources.limits.cpu | default "1000m" | quote }}
              memory: {{ .Values.beaconCloud.resources.limits.memory | default "1Gi" | quote }}
              ephemeral-storage: {{ .Values.beaconCloud.resources.limits.ephemeralStorage | default "2Gi" | quote }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "beacon-cloud-saas-v1.fullname" . }}-config
        - name: app-data
          {{- if .Values.beaconCloud.runtimeStorage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "beacon-cloud-saas-v1.runtimePVCName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.beaconCloud.runtimeStorage.dataSizeLimit | quote }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.beaconCloud.runtimeStorage.tmpSizeLimit | quote }}
        {{- if .Values.demoVolume.enabled }}
        - name: demo
          persistentVolumeClaim:
            claimName: {{ include "beacon-cloud-saas-v1.demoPVCName" . }}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.beaconCloud.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.beaconCloud.tolerations | nindent 8 }}
      affinity:
        {{- if .Values.beaconCloud.affinity }}
        {{- toYaml .Values.beaconCloud.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: beacon-cloud
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "beacon-cloud-saas-v1.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: beacon-cloud
      terminationGracePeriodSeconds: 60
