# Beacon Cloud SaaS v1 - Docker Compose 一键 POC
#
# 用法：
#   cd deploy/cloud-saas-v1
#   cp .env.example .env  # replace every CHANGE_ME value
#   docker compose up -d --build
#   docker compose logs -f beacon-cloud
#   docker compose logs -f beacon-background-worker
#   docker compose logs -f edge-simulator
#
# Web：
#   http://localhost:9991/login  (账号密码由 .env 提供)
#
# 清理：
#   docker compose down -v

x-beacon-cloud-environment: &beacon-cloud-environment
  BEACON_DEPLOYMENT_MODE: cloud
  BEACON_OPEN_API_TOKEN: "${BEACON_OPEN_API_TOKEN:?}"
  BEACON_REQUIRE_OPEN_API_TOKEN: "1"
  BEACON_HEALTH_CHECK_HOST: "${BEACON_DJANGO_HEALTH_CHECK_HOST:-localhost}"
  BEACON_DJANGO_DEBUG: "0"
  BEACON_DJANGO_SECRET_KEY: "${BEACON_DJANGO_SECRET_KEY:?}"
  BEACON_DJANGO_ALLOWED_HOSTS: "${BEACON_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,beacon-cloud}"
  BEACON_DJANGO_SESSION_COOKIE_SECURE: "${BEACON_DJANGO_SESSION_COOKIE_SECURE:-0}"
  BEACON_DJANGO_CSRF_COOKIE_SECURE: "${BEACON_DJANGO_CSRF_COOKIE_SECURE:-0}"
  BEACON_CLOUD_ALLOW_INSECURE_HTTP: "1"
  BEACON_DJANGO_TRUST_X_FORWARDED_PROTO: "${BEACON_DJANGO_TRUST_X_FORWARDED_PROTO:-0}"
  BEACON_DJANGO_CSRF_TRUSTED_ORIGINS: "${BEACON_DJANGO_CSRF_TRUSTED_ORIGINS:-}"
  BEACON_DJANGO_HSTS_SECONDS: "0"
  BEACON_CLOUD_DB_URL: "${BEACON_CLOUD_DB_URL:?}"
  BEACON_REQUIRE_DATABASE_TLS: "0"
  BEACON_CLOUD_EDGE_TOKEN_PEPPER: "${BEACON_CLOUD_EDGE_TOKEN_PEPPER:?}"
  BEACON_CLOUD_S3_BUCKET: beacon-cloud
  BEACON_CLOUD_S3_REGION: us-east-1
  BEACON_CLOUD_S3_ENDPOINT_URL: http://minio:9000
  BEACON_ALLOW_INSECURE_OBJECT_STORAGE: "1"
  BEACON_CLOUD_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?}"
  BEACON_CLOUD_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?}"
  BEACON_CLOUD_IMAGE_PREVIEW_PROXY: "1"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    user: "70:70"
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:mode=0700,uid=70,gid=70
    - /var/run/postgresql:mode=0770,uid=70,gid=70
    environment:
      # NOTE: Do not hard-code credentials in the repo.
      # Create `deploy/cloud-saas-v1/.env` with:
      #   BEACON_CLOUD_DB_NAME=beacon
      #   BEACON_CLOUD_DB_USER=beacon
      #   BEACON_CLOUD_DB_PASSWORD=<strong-random>
      POSTGRES_DB: "${BEACON_CLOUD_DB_NAME:?Set in deploy/cloud-saas-v1/.env}"
      POSTGRES_USER: "${BEACON_CLOUD_DB_USER:?Set in deploy/cloud-saas-v1/.env}"
      POSTGRES_PASSWORD: "${BEACON_CLOUD_DB_PASSWORD:?Set in deploy/cloud-saas-v1/.env}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-volume-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 10001:10001 /data && chmod -R u+rwX,go-rwx /data"]
    volumes:
    - minio_data:/data
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - DAC_READ_SEARCH
    - FOWNER
    security_opt:
    - no-new-privileges:true
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    user: "10001:10001"
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set in deploy/cloud-saas-v1/.env}"
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
    - minio_data:/data
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:mode=0700,uid=10001,gid=10001
    ports:
    - "${BEACON_BIND_ADDRESS:-127.0.0.1}:${BEACON_MINIO_API_PORT:-9000}:9000" # loopback default; nosemgrep: trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces
    - "${BEACON_BIND_ADDRESS:-127.0.0.1}:${BEACON_MINIO_CONSOLE_PORT:-9001}:9001" # loopback default; nosemgrep: trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # MinIO 服务地址（docker 内部网络）
      MINIO_ENDPOINT: http://minio:9000
      # MinIO 账号密码（与 minio service 一致）
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set in deploy/cloud-saas-v1/.env}"
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Beacon Cloud 用到的 bucket
      BEACON_CLOUD_S3_BUCKET: beacon-cloud
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
    - ./scripts/minio_init.sh:/scripts/minio_init.sh:ro
    # NOTE: On Windows, even with `.gitattributes` enforcing `eol=lf`, a local checkout may still
    # end up with CRLF in the working tree. When bind-mounted into Linux containers, CRLF breaks
    # `/bin/sh` with errors like: `set: -\r: invalid option`.
    #
    # Make the POC resilient by normalizing CRLF -> LF at runtime.
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/minio_init.sh | /bin/sh"]
    user: "10001:10001"
    read_only: true
    tmpfs:
    - /tmp:mode=0700,uid=10001,gid=10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: "no"

  beacon-init:
    build:
      context: ../../
      dockerfile: deploy/cloud-saas-v1/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *beacon-cloud-environment
      BEACON_BACKGROUND_ROLE: init
      BEACON_BOOTSTRAP_ADMIN_USERNAME: "${BEACON_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BEACON_BOOTSTRAP_ADMIN_PASSWORD: "${BEACON_BOOTSTRAP_ADMIN_PASSWORD:?}"
      BEACON_BOOTSTRAP_EDGE_CLUSTER_NAME: "edge-default"
      BEACON_BOOTSTRAP_EDGE_TOKEN_FILE: "${BEACON_BOOTSTRAP_EDGE_TOKEN_FILE:?}"
    volumes:
    - demo:/demo
    - ./config.cloud.json:/app/config.json:ro
    - cloud_runtime:/app/data
    user: "10001:10001"
    read_only: true
    tmpfs:
    - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    command: ["/app/deploy/cloud-saas-v1/scripts/initialize.sh"]
    restart: "no"

  beacon-cloud:
    build:
      context: ../../
      dockerfile: deploy/cloud-saas-v1/Dockerfile
    depends_on:
      beacon-init:
        condition: service_completed_successfully
    environment:
      <<: *beacon-cloud-environment
      BEACON_BACKGROUND_ROLE: web
      BEACON_GUNICORN_WORKERS: "${BEACON_GUNICORN_WORKERS:-2}"
      BEACON_GUNICORN_THREADS: "${BEACON_GUNICORN_THREADS:-4}"
      BEACON_MIGRATION_WAIT_ATTEMPTS: "180"
      BEACON_MIGRATION_WAIT_DELAY_SECONDS: "2"
    volumes:
    - ./config.cloud.json:/app/config.json:ro
    - cloud_runtime:/app/data
    user: "10001:10001"
    read_only: true
    tmpfs:
    - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ports:
    - "${BEACON_BIND_ADDRESS:-127.0.0.1}:${BEACON_ADMIN_PORT:-9991}:8000" # loopback default; nosemgrep: trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces
    healthcheck:
      test: ["CMD", "python", "/app/deploy/cloud-saas-v1/scripts/health_probe.py", "ready"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    command: ["/app/deploy/cloud-saas-v1/scripts/entrypoint.sh"]
    restart: unless-stopped

  beacon-background-worker:
    build:
      context: ../../
      dockerfile: deploy/cloud-saas-v1/Dockerfile
    depends_on:
      beacon-init:
        condition: service_completed_successfully
    environment:
      <<: *beacon-cloud-environment
      BEACON_BACKGROUND_ROLE: worker
      BEACON_BACKGROUND_HEARTBEAT_PATH: /tmp/beacon-background-worker.json
      BEACON_BACKGROUND_HEARTBEAT_SECONDS: "5"
      BEACON_BACKGROUND_HEARTBEAT_MAX_AGE_SECONDS: "20"
      BEACON_BACKGROUND_STANDBY_POLL_SECONDS: "5"
      BEACON_MIGRATION_WAIT_ATTEMPTS: "180"
      BEACON_MIGRATION_WAIT_DELAY_SECONDS: "2"
    volumes:
    - ./config.cloud.json:/app/config.json:ro
    - cloud_runtime:/app/data
    user: "10001:10001"
    read_only: true
    tmpfs:
    - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/deploy/cloud-saas-v1/scripts/health_probe.py", "worker"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    command: ["/app/deploy/cloud-saas-v1/scripts/background_worker_entrypoint.sh"]
    restart: unless-stopped

  edge-simulator:
    build:
      context: ../../
      dockerfile: deploy/cloud-saas-v1/Dockerfile
    depends_on:
      beacon-cloud:
        condition: service_healthy
    environment:
      # Cloud 内部访问地址（docker network）
      BEACON_CLOUD_BASE_URL: "http://beacon-cloud:8000"
      # 从共享卷读取 bootstrap 输出的 edge token
      BEACON_BOOTSTRAP_EDGE_TOKEN_FILE: "${BEACON_BOOTSTRAP_EDGE_TOKEN_FILE:?}"
    volumes:
    - demo:/demo:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
    - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    command: ["python", "deploy/cloud-saas-v1/scripts/edge_simulator.py"]
    restart: "no"

volumes:
  pgdata:
  minio_data:
  demo:
  cloud_runtime:
