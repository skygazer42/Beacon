name: Release evidence

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag; dispatch this workflow from the same tag ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-evidence:
    name: Build, attest, and verify source evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Request the short-lived Sigstore signing certificate.
      attestations: write # Store signed attestations in the repository API.
      artifact-metadata: write # Register metadata for the attested artifact.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the event ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_evidence.py validate-ref --root . --tag "${RELEASE_TAG}"
          release_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          evidence_dir="${RUNNER_TEMP}/Beacon-${RELEASE_TAG}-release-evidence"
          source_name="Beacon-${RELEASE_TAG}-source.tar.gz"
          sbom_name="Beacon-${RELEASE_TAG}.spdx.json"
          mkdir -p "${evidence_dir}"
          {
            echo "RELEASE_COMMIT=${release_commit}"
            echo "EVIDENCE_DIR=${evidence_dir}"
            echo "SOURCE_NAME=${source_name}"
            echo "SOURCE_PATH=${evidence_dir}/${source_name}"
            echo "SBOM_NAME=${sbom_name}"
            echo "SBOM_PATH=${evidence_dir}/${sbom_name}"
            echo "PROVENANCE_NAME=provenance.sigstore.json"
            echo "PROVENANCE_PATH=${evidence_dir}/provenance.sigstore.json"
            echo "SBOM_ATTESTATION_NAME=sbom.sigstore.json"
            echo "SBOM_ATTESTATION_PATH=${evidence_dir}/sbom.sigstore.json"
            echo "PROVENANCE_VERIFICATION_NAME=provenance-verification.json"
            echo "PROVENANCE_VERIFICATION_PATH=${evidence_dir}/provenance-verification.json"
            echo "SBOM_VERIFICATION_NAME=sbom-verification.json"
            echo "SBOM_VERIFICATION_PATH=${evidence_dir}/sbom-verification.json"
          } >> "${GITHUB_ENV}"

      - name: Build deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="Beacon-${RELEASE_TAG}/" "${RELEASE_COMMIT}" \
            | gzip -n -9 > "${SOURCE_PATH}"
          chmod 0600 "${SOURCE_PATH}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: Beacon
          SYFT_SOURCE_VERSION: ${{ env.RELEASE_TAG }}
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM_PATH }}
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SLSA provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.SOURCE_PATH }}

      - name: Preserve provenance bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: install -m 0600 "${ATTESTATION_BUNDLE_PATH}" "${PROVENANCE_PATH}"

      - name: Generate SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.SOURCE_PATH }}
          sbom-path: ${{ env.SBOM_PATH }}

      - name: Preserve SBOM attestation bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: install -m 0600 "${ATTESTATION_BUNDLE_PATH}" "${SBOM_ATTESTATION_PATH}"

      - name: Verify signed attestations offline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "${SOURCE_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${PROVENANCE_PATH}" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --format json > "${PROVENANCE_VERIFICATION_PATH}"
          gh attestation verify "${SOURCE_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${SBOM_ATTESTATION_PATH}" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
            --predicate-type "https://spdx.dev/Document" \
            --format json > "${SBOM_VERIFICATION_PATH}"
          chmod 0600 "${PROVENANCE_VERIFICATION_PATH}" "${SBOM_VERIFICATION_PATH}"

      - name: Assemble and re-verify evidence set
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_evidence.py assemble \
            --project-root . \
            --directory "${EVIDENCE_DIR}" \
            --tag "${RELEASE_TAG}" \
            --commit "${RELEASE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --artifact "source=${SOURCE_NAME}" \
            --artifact "sbom=${SBOM_NAME}" \
            --artifact "provenance-attestation=${PROVENANCE_NAME}" \
            --artifact "sbom-attestation=${SBOM_ATTESTATION_NAME}" \
            --artifact "provenance-verification=${PROVENANCE_VERIFICATION_NAME}" \
            --artifact "sbom-verification=${SBOM_VERIFICATION_NAME}"
          python tools/release_evidence.py verify --directory "${EVIDENCE_DIR}"

      - name: Upload immutable workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Beacon-${{ env.RELEASE_TAG }}-release-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish-release-assets:
    name: Attach verified evidence to GitHub Release
    if: github.event_name == 'release'
    needs: build-evidence
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # Attach the verified evidence files to the GitHub Release.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified workflow evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Beacon-${{ env.RELEASE_TAG }}-release-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Verify downloaded evidence
        run: python tools/release_evidence.py verify --directory "${RUNNER_TEMP}/release-evidence"

      - name: Publish without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/release-evidence"/* \
            --repo "${GITHUB_REPOSITORY}"
