name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Strict SemVer tag; dispatch this workflow from the same tag ref
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease after all evidence gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize and prepare draft
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # Create the empty draft that becomes immutable only after verification.
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      release_commit: ${{ steps.validate.outputs.release_commit }}
    env:
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, ref, and monotonic release history
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/${RELEASE_TAG}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            printf 'dispatch ref must be %s, got %s\n' "${expected_ref}" "${GITHUB_REF}" >&2
            exit 1
          fi
          python tools/release_evidence.py validate-ref --root . --tag "${RELEASE_TAG}"
          release_history_path="${RUNNER_TEMP}/beacon-published-releases.json"
          latest_release_path="${RUNNER_TEMP}/beacon-latest-release.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s 'add // []' > "${release_history_path}"
          if jq -e '[.[] | select(.draft != true)] | length == 0' \
            "${release_history_path}" >/dev/null; then
            printf 'null\n' > "${latest_release_path}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "${latest_release_path}"
          fi
          python tools/release_evidence.py validate-history \
            --root . \
            --tag "${RELEASE_TAG}" \
            --releases "${release_history_path}" \
            --latest-release "${latest_release_path}"
          release_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'release_commit=%s\n' "${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Create or validate an empty draft Release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_path="${RUNNER_TEMP}/beacon-draft-release.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${release_path}" 2>/dev/null; then
            create_args=("${RELEASE_TAG}" --draft --verify-tag --generate-notes)
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}" --repo "${GITHUB_REPOSITORY}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              > "${release_path}"
          fi
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --argjson prerelease "${RELEASE_PRERELEASE}" \
            '.tag_name == $tag
             and .draft == true
             and .immutable == false
             and .prerelease == $prerelease
             and (.assets | length) == 0' \
            "${release_path}" >/dev/null
          release_id="$(jq -r '.id' "${release_path}")"
          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            printf 'draft Release returned an invalid id\n' >&2
            exit 1
          fi
          printf 'release_id=%s\n' "${release_id}" >> "${GITHUB_OUTPUT}"

  source-evidence:
    name: Build source evidence
    needs: authorize
    uses: ./.github/workflows/release-evidence.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      id-token: write # Request short-lived Sigstore identity for source provenance.
      attestations: write # Store signed source and SBOM attestations.
      artifact-metadata: write # Register metadata for the attested source archive.

  container-evidence:
    name: Build container evidence
    needs: authorize
    uses: ./.github/workflows/release-container.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      packages: write # Publish the verified immutable image to GHCR.
      id-token: write # Request short-lived Sigstore identity for image provenance.
      attestations: write # Store signed image and SBOM attestations.
      artifact-metadata: write # Register metadata for the attested image.

  publish:
    name: Verify assets and publish immutable Release
    needs: [authorize, source-evidence, container-evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Upload verified draft assets and publish the Release.
      attestations: read # Re-verify source and image attestations before publication.
    env:
      RELEASE_COMMIT: ${{ needs.authorize.outputs.release_commit }}
      RELEASE_ID: ${{ needs.authorize.outputs.release_id }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_EVIDENCE_DIR: ${{ github.workspace }}/.release-source-evidence
      CONTAINER_EVIDENCE_DIR: ${{ github.workspace }}/.release-container-evidence
    steps:
      - name: Check out release verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Beacon-${{ inputs.tag }}-release-evidence
          path: ${{ env.SOURCE_EVIDENCE_DIR }}

      - name: Download container evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Beacon-${{ inputs.tag }}-container-evidence
          path: ${{ env.CONTAINER_EVIDENCE_DIR }}

      - name: Verify exact evidence membership and checksums
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_evidence.py verify --directory "${SOURCE_EVIDENCE_DIR}"
          (
            cd "${CONTAINER_EVIDENCE_DIR}"
            sha256sum --check SHA256SUMS.container
          )
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_EVIDENCE_DIR"])
          container = Path(os.environ["CONTAINER_EVIDENCE_DIR"])
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_COMMIT"]
          repository = os.environ["GITHUB_REPOSITORY"]
          expected_source = {
              f"Beacon-{tag}-source.tar.gz",
              f"Beacon-{tag}.spdx.json",
              "provenance.sigstore.json",
              "sbom.sigstore.json",
              "provenance-verification.json",
              "sbom-verification.json",
              "release-manifest.json",
              "SHA256SUMS",
          }
          expected_container = {
              "container-release.json",
              "container.spdx.json",
              "container-vulnerability-report.json",
              "image-index.json",
              "linux-amd64-manifest.json",
              "container-provenance.sigstore.json",
              "container-sbom.sigstore.json",
              "container-provenance-verification.json",
              "container-sbom-verification.json",
              "SHA256SUMS.container",
          }
          actual_source = {path.name for path in source.iterdir()}
          actual_container = {path.name for path in container.iterdir()}
          if actual_source != expected_source:
              raise SystemExit("source evidence membership differs from the release contract")
          if actual_container != expected_container:
              raise SystemExit("container evidence membership differs from the release contract")
          metadata = json.loads((container / "container-release.json").read_text(encoding="utf-8"))
          image = str(metadata.get("image") or "")
          digest = str(metadata.get("digest") or "")
          if metadata.get("sourceRepository") != repository:
              raise SystemExit("container evidence repository mismatch")
          if metadata.get("sourceRef") != f"refs/tags/{tag}":
              raise SystemExit("container evidence tag mismatch")
          if metadata.get("sourceCommit") != commit:
              raise SystemExit("container evidence commit mismatch")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("container evidence digest is invalid")
          if metadata.get("immutableReference") != f"{image}@{digest}":
              raise SystemExit("container evidence immutable reference mismatch")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"image={image}\n")
              stream.write(f"digest={digest}\n")
          PY
        id: evidence

      - name: Re-verify signed source and container attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.evidence.outputs.digest }}
          IMAGE_NAME: ${{ steps.evidence.outputs.image }}
        run: |
          set -euo pipefail
          source_path="${SOURCE_EVIDENCE_DIR}/Beacon-${RELEASE_TAG}-source.tar.gz"
          gh attestation verify "${source_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${SOURCE_EVIDENCE_DIR}/provenance.sigstore.json" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
            --predicate-type "https://slsa.dev/provenance/v1"
          gh attestation verify "${source_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${SOURCE_EVIDENCE_DIR}/sbom.sigstore.json" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml" \
            --predicate-type "https://spdx.dev/Document"
          gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${CONTAINER_EVIDENCE_DIR}/container-provenance.sigstore.json" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-container.yml" \
            --predicate-type "https://slsa.dev/provenance/v1"
          gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${CONTAINER_EVIDENCE_DIR}/container-sbom.sigstore.json" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-container.yml" \
            --predicate-type "https://spdx.dev/Document"

      - name: Upload verified assets to the empty draft without replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_path="${RUNNER_TEMP}/beacon-release-before-upload.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_path}"
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --argjson prerelease "${RELEASE_PRERELEASE}" \
            '.tag_name == $tag
             and .draft == true
             and .immutable == false
             and .prerelease == $prerelease
             and (.assets | length) == 0' \
            "${release_path}" >/dev/null
          gh release upload "${RELEASE_TAG}" \
            "${SOURCE_EVIDENCE_DIR}"/* \
            "${CONTAINER_EVIDENCE_DIR}"/* \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify uploaded asset set and publish immutably
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_path="${RUNNER_TEMP}/beacon-release-with-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_path}"
          python - "${release_path}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"]
          expected = {
              f"Beacon-{tag}-source.tar.gz",
              f"Beacon-{tag}.spdx.json",
              "provenance.sigstore.json",
              "sbom.sigstore.json",
              "provenance-verification.json",
              "sbom-verification.json",
              "release-manifest.json",
              "SHA256SUMS",
              "container-release.json",
              "container.spdx.json",
              "container-vulnerability-report.json",
              "image-index.json",
              "linux-amd64-manifest.json",
              "container-provenance.sigstore.json",
              "container-sbom.sigstore.json",
              "container-provenance-verification.json",
              "container-sbom-verification.json",
              "SHA256SUMS.container",
          }
          assets = payload.get("assets") or []
          actual = {str(asset.get("name") or "") for asset in assets}
          if actual != expected or len(assets) != len(expected):
              raise SystemExit("draft Release does not contain the exact verified asset set")
          if any(not str(asset.get("digest") or "").startswith("sha256:") for asset in assets):
              raise SystemExit("draft Release contains an asset without a GitHub SHA-256 digest")
          PY
          published_path="${RUNNER_TEMP}/beacon-published-release.json"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false > "${published_path}"
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --argjson prerelease "${RELEASE_PRERELEASE}" \
            '.tag_name == $tag
             and .draft == false
             and .immutable == true
             and .prerelease == $prerelease
             and (.assets | length) == 18' \
            "${published_path}" >/dev/null
