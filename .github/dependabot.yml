version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /Admin/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # React, Ant Design, Recharts, Vite and the test stack require a planned
    # compatibility migration for major releases. Security updates are not
    # suppressed by version-update ignore rules.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /sdk/javascript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript-sdk:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /Admin
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      admin-python:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Beacon supports Python 3.10-3.12. Django 6.1 drops Python 3.10-3.11,
    # while OpenCV >=4.12 forces the NumPy 2 ABI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opencv-python"
        versions: [">=4.12"]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-sdk:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      documentation:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-sdk:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /deploy/cloud-saas-v1
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cloud-images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "python"
        versions: [">=3.13"]

  - package-ecosystem: docker-compose
    directory: /deploy/observability/tracing
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tracing-images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
